<!DOCTYPE html>
<html>
  <head>
    <title>Проект "Комменты"</title>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
      }

      .container {
        font-family: Helvetica;
        color: #ffffff;
        display: flex;
        flex-direction: column;
        align-items: center;
        padding-top: 80px;
        padding-bottom: 200px;
        background: #202020;
        min-height: 100vh;
      }

      .comments,
      .comment {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      .comment,
      .add-form {
        width: 596px;
        box-sizing: border-box;
        background: radial-gradient(
          75.42% 75.42% at 50% 42.37%,
          rgba(53, 53, 53, 0) 22.92%,
          #7334ea 100%
        );
        filter: drop-shadow(0px 20px 67px rgba(0, 0, 0, 0.08));
        border-radius: 20px;
      }

      .comments {
        display: flex;
        flex-direction: column;
        gap: 24px;
      }

      .comment {
        padding: 48px;
      }

      .comment-header {
        font-size: 16px;
        display: flex;
        justify-content: space-between;
      }

      .comment-footer {
        display: flex;
        justify-content: flex-end;
      }

      .comment-body {
        margin-top: 32px;
        margin-bottom: 32px;
      }

      .comment-text {
        font-size: 32px;
      }

      .likes {
        display: flex;
        align-items: center;
      }

      .like-button {
        all: unset;
        cursor: pointer;
      }

      .likes-counter {
        font-size: 26px;
        margin-right: 8px;
      }

      .like-button {
        margin-left: 10px;
        background-image: url("data:image/svg+xml,%3Csvg width='22' height='20' viewBox='0 0 22 20' fill='none' xmlns='http://www.w3.org/2000/svg' %3E%3Cpath d='M11.11 16.9482L11 17.0572L10.879 16.9482C5.654 12.2507 2.2 9.14441 2.2 5.99455C2.2 3.81471 3.85 2.17984 6.05 2.17984C7.744 2.17984 9.394 3.26975 9.977 4.75204H12.023C12.606 3.26975 14.256 2.17984 15.95 2.17984C18.15 2.17984 19.8 3.81471 19.8 5.99455C19.8 9.14441 16.346 12.2507 11.11 16.9482ZM15.95 0C14.036 0 12.199 0.882834 11 2.26703C9.801 0.882834 7.964 0 6.05 0C2.662 0 0 2.6267 0 5.99455C0 10.1035 3.74 13.4714 9.405 18.5613L11 20L12.595 18.5613C18.26 13.4714 22 10.1035 22 5.99455C22 2.6267 19.338 0 15.95 0Z' fill='%23BCEC30' /%3E%3C/svg%3E");
        background-repeat: no-repeat;
        width: 22px;
        height: 22px;
      }

      .-active-like {
        background-image: url("data:image/svg+xml,%3Csvg width='22' height='20' viewBox='0 0 22 20' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M15.95 0C14.036 0 12.199 0.882834 11 2.26703C9.801 0.882834 7.964 0 6.05 0C2.662 0 0 2.6267 0 5.99455C0 10.1035 3.74 13.4714 9.405 18.5613L11 20L12.595 18.5613C18.26 13.4714 22 10.1035 22 5.99455C22 2.6267 19.338 0 15.95 0Z' fill='%23BCEC30'/%3E%3C/svg%3E");
      }

      .add-form {
        padding: 20px;
        margin-top: 48px;
        display: flex;
        flex-direction: column;
      }

      .add-form-name,
      .add-form-text {
        font-size: 16px;
        font-family: Helvetica;
        border-radius: 8px;
        border: none;
      }

      .add-form-name {
        width: 300px;
        padding: 11px 22px;
      }

      .add-form-text {
        margin-top: 12px;
        padding: 22px;
        resize: none;
      }

      .add-form-row {
        display: flex;
        justify-content: flex-end;
      }

      .add-form-button {
        margin-top: 24px;
        font-size: 24px;
        padding: 10px 20px;
        background-color: #bcec30;
        border: none;
        border-radius: 18px;
        cursor: pointer;
      }

      .add-form-button:hover {
        opacity: 0.9;
      }
    </style>
  </head>

  <body>
    <div class="container">
      <ul class="comments" id="comments-list">
        <li class="comment" data-id="1">
          <div class="comment-header">
            <div>Глеб Фокин</div>
            <div>12.02.22 12:18</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Это будет первый комментарий на этой странице
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">3</span>
              <button class="like-button" data-id="1"></button>
            </div>
          </div>
        </li>
        <li class="comment" data-id="2">
          <div class="comment-header">
            <div>Варвара Н.</div>
            <div>13.02.22 19:22</div>
          </div>
          <div class="comment-body">
            <div class="comment-text">
              Мне нравится как оформлена эта страница! ❤
            </div>
          </div>
          <div class="comment-footer">
            <div class="likes">
              <span class="likes-counter">75</span>
              <button class="like-button -active-like" data-id="2"></button>
            </div>
          </div>
        </li>
      </ul>
      <div class="add-form">
        <input
          type="text"
          class="add-form-name"
          placeholder="Введите ваше имя"
        />
        <textarea
          type="textarea"
          class="add-form-text"
          placeholder="Введите ваш коментарий"
          rows="4"
        ></textarea>
        <div class="add-form-row">
          <button class="add-form-button">Написать</button>
        </div>
      </div>
    </div>

    <script>
      "use strict";
      
      // Массив для хранения данных комментариев
      let commentsData = [
        {
          id: 1,
          name: "Глеб Фокин",
          date: "12.02.22 12:18",
          text: "Это будет первый комментарий на этой странице",
          likes: 3,
          isLiked: false
        },
        {
          id: 2,
          name: "Варвара Н.",
          date: "13.02.22 19:22",
          text: "Мне нравится как оформлена эта страница! ❤",
          likes: 75,
          isLiked: true
        }
      ];

      // Получаем элементы формы
      const nameInput = document.querySelector('.add-form-name');
      const commentInput = document.querySelector('.add-form-text');
      const addButton = document.querySelector('.add-form-button');
      const commentsList = document.getElementById('comments-list');

      // Функция для форматирования даты
      function formatDate(date) {
        const d = new Date(date);
        return `${d.getDate().toString().padStart(2, '0')}.${(d.getMonth() + 1).toString().padStart(2, '0')}.${d.getFullYear().toString().slice(-2)} ${d.getHours().toString().padStart(2, '0')}:${d.getMinutes().toString().padStart(2, '0')}`;
      }

      // Функция рендера комментариев 
      function renderComments() {
        commentsList.innerHTML = commentsData.map(comment => `
          <li class="comment" data-id="${comment.id}">
            <div class="comment-header">
              <div>${comment.name}</div>
              <div>${comment.date}</div>
            </div>
            <div class="comment-body">
              <div class="comment-text">
                ${comment.text}
              </div>
            </div>
            <div class="comment-footer">
              <div class="likes">
                <span class="likes-counter">${comment.likes}</span>
                <button class="like-button ${comment.isLiked ? '-active-like' : ''}" data-id="${comment.id}"></button>
              </div>
            </div>
          </li>
        `).join('');

        // Добавляем обработчики лайков
        document.querySelectorAll('.like-button').forEach(button => {
          button.addEventListener('click', handleLike);
        });
      }

      // Обработчик лайков
      function handleLike(event) {
        const commentId = Number(event.target.dataset.id);
        const comment = commentsData.find(c => c.id === commentId);
        
        if (comment) {
          comment.isLiked = !comment.isLiked;
          comment.likes += comment.isLiked ? 1 : -1;
          renderComments();
        }
      }

      // Обработчик добавления комментария
      addButton.addEventListener('click', () => {
        const name = nameInput.value.trim();
        const text = commentInput.value.trim();

        if (!name || !text) {
          alert('Пожалуйста, заполните все поля!');
          return;
        }

        const newComment = {
          id: Date.now(), // Используем timestamp как уникальный ID
          name,
          date: formatDate(new Date()),
          text,
          likes: 0,
          isLiked: false
        };

        commentsData.unshift(newComment); // Добавляем в начало массива
        renderComments();

        // Очищаем поля ввода
        nameInput.value = '';
        commentInput.value = '';
      });

      // Инициализация при загрузке страницы
      document.addEventListener('DOMContentLoaded', () => {
        renderComments();
        
        // Обработчик Enter в поле комментария
        commentInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            addButton.click();
          }
        });
      });
    </script>
  </body>
</html>
